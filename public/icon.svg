<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Darker, Foody Green Gradient (Appetizing & Organic) -->
    <linearGradient id="foodyDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />   <!-- Fresh Basil / Leaf Green -->
      <stop offset="50%" stop-color="#15803d" />  <!-- Deep Organic Green -->
      <stop offset="100%" stop-color="#064e3b" /> <!-- Rich Dark Farm Green -->
    </linearGradient>

    <!-- Minimal, Grounded Drop Shadow -->
    <filter id="minimalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 
    ========================================================================
    TAMAM LOGO MARK (Carved Edges & Clear Checkmark)
    ========================================================================
    - Left arm mathematically shortened (Y=220) to ensure it acts strictly 
      as a Checkmark and NOT a "V".
    - stroke-width="24" and stroke-linejoin="round" are applied to smoothly 
      "carve" all sharp edges into thick, friendly, professional curves 
      while preserving the precise gaps between the shapes.
  -->
  <g 
    fill="url(#foodyDarkGrad)" 
    stroke="url(#foodyDarkGrad)"
    stroke-width="24"
    stroke-linejoin="round"
    filter="url(#minimalShadow)"
  >
    
    <!-- 1. The Main Checkmark (Short Left Arm, Tall Right Arm) -->
    <path d="
      M 54.4 220 
      L 190 446 
      L 448 16 
      L 338 16 
      L 190 262.67 
      L 164.4 220 
      Z" 
    />

    <!-- 2. Speed Dash Bottom (Longest) -->
    <path d="
      M 300 346 
      L 490 346 
      L 490 406 
      L 264 406 
      Z" 
    />

    <!-- 3. Speed Dash Middle -->
    <path d="
      M 360 246 
      L 490 246 
      L 490 306 
      L 324 306 
      Z" 
    />

    <!-- 4. Speed Dash Top (Shortest) -->
    <path d="
      M 420 146 
      L 490 146 
      L 490 206 
      L 384 206 
      Z" 
    />
    
  </g>
</svg>