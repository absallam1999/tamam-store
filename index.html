<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Store Control Platform — منصة تحكم المتجر" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("store-theme-preference");

          // Default to System mode
          if (!theme || theme === "system") {
            theme = "system";
            localStorage.setItem("store-theme-preference", "system");
          }

          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          // Listen for system theme changes when in system mode
          if (theme === "system") {
            window
              .matchMedia("(prefers-color-scheme: dark)")
              .addEventListener("change", function (e) {
                if (e.matches) {
                  document.documentElement.classList.add("dark");
                } else {
                  document.documentElement.classList.remove("dark");
                }
              });
          }

          // Language
          var language = localStorage.getItem("store-language") || "ar";
          document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
          document.documentElement.lang = language;
        } catch (e) {}
      })();
    </script>

    <title>منصة تحكم المتجر | Store Control Platform</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
